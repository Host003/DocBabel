[project]
name = "babeldoc-web"
version = "0.1.0"
description = "BabelDOC Web - 基于 BabelDOC 核心引擎的 Web 翻译平台"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5.0",
    "aiofiles>=24.1.0",
    "httpx>=0.27.0",
    "openai>=1.68.2",
    "email-validator>=2.0.0",
    # BabelDOC fork (Host003/BabelDOC), pinned to commit 8784908 (v0.6.4)
    "babeldoc @ git+https://github.com/Host003/BabelDOC.git@8784908efa3681df85bfc6339daec26c0eab6bf0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

